<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Malayan Interstate Cricket Players 1889–1957</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #faf9f6;
  --card-bg: #fff;
  --border: #d4c9b8;
  --text: #2c2416;
  --text-muted: #6b5d4d;
  --accent: #8b4513;
  --accent-light: #f5ebe0;
  --highlight: #fff3cd;
}

body {
  font-family: 'Georgia', 'Times New Roman', serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

header {
  background: var(--accent);
  color: #faf9f6;
  padding: 1.5rem 2rem;
}

header h1 {
  font-size: 1.5rem;
  font-weight: normal;
  letter-spacing: 0.02em;
}

header p {
  font-size: 0.85rem;
  opacity: 0.8;
  margin-top: 0.25rem;
}

.search-bar {
  padding: 1rem 2rem;
  background: var(--card-bg);
  border-bottom: 1px solid var(--border);
}

.search-bar input {
  width: 100%;
  max-width: 500px;
  padding: 0.6rem 0.85rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: inherit;
  font-size: 0.95rem;
}

.search-bar input:focus {
  outline: none;
  border-color: var(--accent);
}

main {
  max-width: 960px;
  margin: 1.5rem auto;
  padding: 0 1rem;
}

.player-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
}

.player-list button {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 0.4rem 0.85rem;
  font-family: inherit;
  font-size: 0.85rem;
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.player-list button:hover {
  background: var(--accent);
  color: #faf9f6;
  border-color: var(--accent);
}

.player-list button.active {
  background: var(--accent);
  color: #faf9f6;
  border-color: var(--accent);
}

.player-list button small {
  color: var(--text-muted);
  font-size: 0.78rem;
}

.player-list button:hover small,
.player-list button.active small {
  color: rgba(250, 249, 246, 0.7);
}

.player-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 1.5rem;
  overflow: hidden;
}

.player-card-header {
  background: var(--accent);
  color: #faf9f6;
  padding: 0.75rem 1.25rem;
}

.player-card-header h2 {
  font-size: 1.15rem;
  font-weight: normal;
}

.player-card-body {
  padding: 1rem 1.25rem;
}

.section-title {
  font-size: 0.9rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
  margin-top: 1.25rem;
}

.section-title:first-child { margin-top: 0; }

.summary-line {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 0.75rem;
  font-style: italic;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.85rem;
  border: 1px solid var(--border);
  margin-bottom: 0.5rem;
}

th, td {
  padding: 0.35rem 0.5rem;
  text-align: left;
  border-bottom: 1px solid #ece6d8;
}

th {
  background: #f8f5ee;
  font-weight: 600;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-muted);
}

td.runs, th.runs { text-align: right; width: 50px; }
td.num, th.num { text-align: right; }

td a {
  color: var(--accent);
  text-decoration: none;
}

td a:hover {
  text-decoration: underline;
}

.empty-state {
  text-align: center;
  padding: 4rem 1rem 2rem;
  color: var(--text-muted);
}

.empty-state .prompt {
  font-size: 1.1rem;
  font-style: italic;
  margin-bottom: 1.5rem;
}

.empty-state .all-players {
  font-size: 0.85rem;
  margin-bottom: 1rem;
}

.highlight {
  background: var(--highlight);
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.stat-box {
  background: var(--accent-light);
  border-radius: 4px;
  padding: 0.6rem 0.75rem;
  text-align: center;
}

.stat-box .stat-value {
  font-size: 1.3rem;
  font-weight: bold;
  color: var(--accent);
}

.stat-box .stat-label {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--text-muted);
}

.team-list {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  justify-content: center;
}

.team-btn {
  background: var(--card-bg);
  border: 2px solid var(--border);
  border-radius: 6px;
  padding: 1rem 1.5rem;
  font-family: inherit;
  font-size: 1rem;
  font-weight: bold;
  color: var(--accent);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  min-width: 180px;
  text-align: center;
}

.team-btn small {
  display: block;
  font-weight: normal;
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-top: 0.2rem;
}

.team-btn:hover {
  background: var(--accent);
  border-color: var(--accent);
  color: #faf9f6;
}

.team-btn:hover small {
  color: rgba(250, 249, 246, 0.7);
}

.team-header {
  margin-bottom: 1rem;
}

.team-header h2 {
  font-size: 1.25rem;
  color: var(--accent);
}

.team-header .team-count {
  font-size: 0.85rem;
  color: var(--text-muted);
}

.back-link {
  margin-bottom: 1rem;
}

.back-link button {
  background: none;
  border: none;
  font-family: inherit;
  font-size: 0.9rem;
  color: var(--accent);
  cursor: pointer;
  padding: 0;
}

.back-link button:hover {
  text-decoration: underline;
}

.filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  align-items: center;
  margin-bottom: 0.75rem;
}

.filter-row select {
  padding: 0.35rem 0.6rem;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: inherit;
  font-size: 0.82rem;
  background: var(--card-bg);
  color: var(--text);
}

.filter-row label {
  font-size: 0.82rem;
  color: var(--text-muted);
}

.filtered-note {
  font-size: 0.8rem;
  color: var(--text-muted);
  font-style: italic;
  margin-bottom: 0.5rem;
}

@media (max-width: 600px) {
  header { padding: 1rem; }
  .search-bar { padding: 0.75rem 1rem; }
  main { padding: 0 0.5rem; }
  table { font-size: 0.78rem; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<header>
  <h1>Malayan Interstate Cricket Players</h1>
  <p>1889–1957 &middot; batting and bowling records from the ACS archive</p>
</header>

<div class="search-bar">
  <input type="search" id="search" placeholder="Search for a player…" autofocus>
</div>

<main id="results"></main>

<script>
let scorecards = [];
let playerIndex = {};
let teamIndex = {};
let allPlayerNames = [];
let allTeamNames = [];
let selectedPlayer = null;
let selectedTeam = null;
let dismissalFilter = '';

async function init() {
  const resp = await fetch('scorecards.json');
  scorecards = await resp.json();
  buildPlayerIndex();
  render();
  document.getElementById('search').addEventListener('input', () => {
    selectedPlayer = null;
    selectedTeam = null;
    dismissalFilter = '';
    render();
  });
}

function normalizeTeam(t) {
  return t.trim().toUpperCase().replace(/&AMP;/g, '&');
}

function buildPlayerIndex() {
  playerIndex = {};
  for (const sc of scorecards) {
    const m = sc.match || {};
    const matchLabel = `${m.team1 || '?'} v ${m.team2 || '?'}`;
    const matchDate = m.date || '';
    const sourceUrl = sc.source_url || '';

    for (const inn of sc.innings || []) {
      const team = inn.team || '';
      const innNum = inn.innings_number || 1;
      const opponent = normalizeTeam(team) === normalizeTeam(m.team1 || '')
        ? (m.team2 || '?') : (m.team1 || '?');

      for (const b of inn.batting || []) {
        if (!b.name) continue;
        if (!playerIndex[b.name]) playerIndex[b.name] = { batting: [], bowling: [] };
        playerIndex[b.name].batting.push({
          match: matchLabel, date: matchDate, team, opponent,
          innings: innNum, dismissal: b.dismissal, runs: b.runs,
          captain: b.captain, wicketkeeper: b.wicketkeeper,
          sourceUrl
        });
      }

      for (const bw of inn.bowling || []) {
        if (!bw.name) continue;
        if (!playerIndex[bw.name]) playerIndex[bw.name] = { batting: [], bowling: [] };
        playerIndex[bw.name].bowling.push({
          match: matchLabel, date: matchDate, team, opponent,
          innings: innNum, overs: bw.overs, maidens: bw.maidens,
          runs: bw.runs, wickets: bw.wickets,
          sourceUrl
        });
      }
    }
  }
  allPlayerNames = Object.keys(playerIndex).sort();

  teamIndex = {};
  for (const name of allPlayerNames) {
    const p = playerIndex[name];
    const teams = new Set();
    for (const b of p.batting) teams.add(normalizeTeam(b.team));
    for (const b of p.bowling) teams.add(normalizeTeam(b.team));
    for (const t of teams) {
      if (!teamIndex[t]) teamIndex[t] = [];
      teamIndex[t].push(name);
    }
  }
  allTeamNames = Object.keys(teamIndex).sort();
}

function findMatchingPlayers(query) {
  if (!query || query.length < 2) return [];
  const q = query.toLowerCase();
  const matches = allPlayerNames.filter(n => n.toLowerCase().includes(q));
  matches.sort((a, b) => {
    const aStarts = a.toLowerCase().startsWith(q) ? 0 : 1;
    const bStarts = b.toLowerCase().startsWith(q) ? 0 : 1;
    if (aStarts !== bStarts) return aStarts - bStarts;
    return a.localeCompare(b);
  });
  return matches;
}

function selectPlayer(name) {
  selectedPlayer = name;
  dismissalFilter = '';
  render();
  document.querySelector('.player-card')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function selectTeam(name) {
  selectedTeam = name;
  selectedPlayer = null;
  dismissalFilter = '';
  render();
}

function render() {
  const container = document.getElementById('results');
  const query = document.getElementById('search').value.trim().toLowerCase();

  if (selectedPlayer && playerIndex[selectedPlayer]) {
    let html = renderBackLink() + renderPlayerCard(selectedPlayer);
    container.innerHTML = html;
    bindDismissalFilter();
    bindBackLink(container);
    return;
  }

  if (selectedTeam && teamIndex[selectedTeam]) {
    const players = teamIndex[selectedTeam];
    let html = renderBackLink();
    html += `<div class="team-header"><h2>${esc(selectedTeam)}</h2>
      <div class="team-count">${players.length} players</div></div>`;
    html += '<div class="player-list">';
    for (const name of players) {
      html += playerButton(name);
    }
    html += '</div>';
    container.innerHTML = html;
    bindButtons(container);
    bindBackLink(container);
    return;
  }

  const matched = findMatchingPlayers(query);

  if (!query) {
    let html = `<div class="empty-state">
      <div class="prompt">Search for a player, or browse by team.</div>
      <div class="all-players">${allPlayerNames.length} players across ${allTeamNames.length} teams</div>
    </div>`;
    html += '<div class="team-list">';
    for (const team of allTeamNames) {
      const count = teamIndex[team].length;
      html += `<button class="team-btn" data-team="${esc(team)}">${esc(team)} <small>(${count})</small></button>`;
    }
    html += '</div>';
    container.innerHTML = html;
    container.querySelectorAll('.team-btn').forEach(btn => {
      btn.addEventListener('click', () => selectTeam(btn.dataset.team));
    });
    return;
  }

  if (matched.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="prompt">No players match "${esc(query)}"</div></div>`;
    return;
  }

  if (matched.length === 1) {
    selectedPlayer = matched[0];
    let html = renderBackLink() + renderPlayerCard(matched[0]);
    container.innerHTML = html;
    bindDismissalFilter();
    bindBackLink(container);
    return;
  }

  let html = `<div class="player-list">`;
  for (const name of matched) {
    html += playerButton(name, query);
  }
  html += '</div>';
  container.innerHTML = html;
  bindButtons(container);
}

function renderBackLink() {
  return `<div class="back-link"><button id="back-btn">&larr; Back</button></div>`;
}

function bindBackLink(container) {
  const btn = container.querySelector('#back-btn');
  if (btn) {
    btn.addEventListener('click', () => {
      if (selectedPlayer && selectedTeam) {
        selectedPlayer = null;
        dismissalFilter = '';
      } else {
        selectedPlayer = null;
        selectedTeam = null;
        dismissalFilter = '';
        document.getElementById('search').value = '';
      }
      render();
    });
  }
}

function playerButton(name, query) {
  const p = playerIndex[name];
  const batCount = p.batting.length;
  const bowlCount = p.bowling.length;
  const parts = [];
  if (batCount) parts.push(`${batCount} bat`);
  if (bowlCount) parts.push(`${bowlCount} bowl`);
  const label = query ? hl(esc(name), query) : esc(name);
  return `<button data-player="${esc(name)}">${label} <small>(${parts.join(', ')})</small></button>`;
}

function bindDismissalFilter() {
  const sel = document.getElementById('dismissal-filter');
  if (sel) {
    sel.addEventListener('change', () => {
      dismissalFilter = sel.value;
      render();
    });
  }
}

function bindButtons(container) {
  container.querySelectorAll('.player-list button').forEach(btn => {
    btn.addEventListener('click', () => selectPlayer(btn.dataset.player));
  });
}

function renderPlayerCard(name) {
  const p = playerIndex[name];
  if (!p) return '';

  let html = `<div class="player-card">
    <div class="player-card-header"><h2>${esc(name)}</h2></div>
    <div class="player-card-body">`;

  if (p.batting.length) {
    const types = getDismissalTypes(p.batting);
    const filtered = dismissalFilter
      ? p.batting.filter(b => dismissalType(b.dismissal) === dismissalFilter)
      : p.batting;

    const totalRuns = p.batting.reduce((s, b) => s + (b.runs || 0), 0);
    const innCount = p.batting.length;
    const notOuts = p.batting.filter(b => b.dismissal && b.dismissal.toLowerCase() === 'not out').length;
    const dismissals = innCount - notOuts;
    const hs = Math.max(...p.batting.map(b => b.runs || 0));
    const avg = dismissals > 0 ? (totalRuns / dismissals).toFixed(2) : '-';

    html += `<h3 class="section-title">Batting</h3>`;
    html += `<div class="stat-grid">
      <div class="stat-box"><div class="stat-value">${innCount}</div><div class="stat-label">Innings</div></div>
      <div class="stat-box"><div class="stat-value">${totalRuns}</div><div class="stat-label">Runs</div></div>
      <div class="stat-box"><div class="stat-value">${hs}</div><div class="stat-label">High Score</div></div>
      <div class="stat-box"><div class="stat-value">${avg}</div><div class="stat-label">Average</div></div>
      <div class="stat-box"><div class="stat-value">${notOuts}</div><div class="stat-label">Not Outs</div></div>
    </div>`;

    html += `<div class="filter-row"><label for="dismissal-filter">Dismissal:</label>
      <select id="dismissal-filter">
        <option value="">All (${p.batting.length})</option>`;
    for (const t of types) {
      const count = p.batting.filter(b => dismissalType(b.dismissal) === t).length;
      html += `<option value="${esc(t)}"${dismissalFilter === t ? ' selected' : ''}>${esc(t)} (${count})</option>`;
    }
    html += `</select></div>`;

    if (dismissalFilter && filtered.length !== p.batting.length) {
      html += `<div class="filtered-note">Showing ${filtered.length} of ${p.batting.length} innings</div>`;
    }

    html += `<table><thead><tr>
      <th>Match</th><th>Date</th><th>For</th><th>Vs</th><th>Inn</th><th>Dismissal</th><th class="runs">Runs</th>
    </tr></thead><tbody>`;
    for (const b of filtered) {
      html += `<tr>
        <td>${b.sourceUrl ? `<a href="${esc(b.sourceUrl)}" target="_blank" rel="noopener">${esc(b.match)}</a>` : esc(b.match)}</td>
        <td>${esc(b.date)}</td>
        <td>${esc(b.team)}</td>
        <td>${esc(b.opponent)}</td>
        <td>${ordinal(b.innings)}</td>
        <td>${esc(b.dismissal || '')}</td>
        <td class="runs">${b.runs ?? ''}</td>
      </tr>`;
    }
    html += '</tbody></table>';
  }

  if (p.bowling.length) {
    const cols = bowlingCols(p.bowling);
    const totalWickets = p.bowling.reduce((s, b) => s + (b.wickets || 0), 0);
    const totalRuns = cols.runs ? p.bowling.reduce((s, b) => s + (b.runs || 0), 0) : null;
    const spellCount = p.bowling.length;
    const best = p.bowling.reduce((best, b) => {
      if (!best) return b;
      if ((b.wickets || 0) > (best.wickets || 0)) return b;
      if ((b.wickets || 0) === (best.wickets || 0) && (b.runs || Infinity) < (best.runs || Infinity)) return b;
      return best;
    }, null);

    html += `<h3 class="section-title">Bowling</h3>`;
    html += `<div class="stat-grid">
      <div class="stat-box"><div class="stat-value">${spellCount}</div><div class="stat-label">Innings</div></div>
      <div class="stat-box"><div class="stat-value">${totalWickets}</div><div class="stat-label">Wickets</div></div>`;
    if (totalRuns != null) {
      const avg = totalWickets > 0 ? (totalRuns / totalWickets).toFixed(2) : '-';
      html += `<div class="stat-box"><div class="stat-value">${totalRuns}</div><div class="stat-label">Runs Conc.</div></div>`;
      html += `<div class="stat-box"><div class="stat-value">${avg}</div><div class="stat-label">Average</div></div>`;
    }
    if (best && best.wickets) {
      const bestStr = best.runs != null ? `${best.wickets}/${best.runs}` : `${best.wickets} wkts`;
      html += `<div class="stat-box"><div class="stat-value">${bestStr}</div><div class="stat-label">Best</div></div>`;
    }
    html += `</div>`;

    html += `<table><thead><tr>
      <th>Match</th><th>Date</th><th>For</th><th>Vs</th><th>Inn</th>
      ${cols.overs ? '<th class="num">O</th>' : ''}${cols.maidens ? '<th class="num">M</th>' : ''}${cols.runs ? '<th class="num">R</th>' : ''}${cols.wickets ? '<th class="num">W</th>' : ''}
    </tr></thead><tbody>`;
    for (const b of p.bowling) {
      html += `<tr>
        <td>${b.sourceUrl ? `<a href="${esc(b.sourceUrl)}" target="_blank" rel="noopener">${esc(b.match)}</a>` : esc(b.match)}</td>
        <td>${esc(b.date)}</td>
        <td>${esc(b.team)}</td>
        <td>${esc(b.opponent)}</td>
        <td>${ordinal(b.innings)}</td>
        ${cols.overs ? `<td class="num">${b.overs ?? ''}</td>` : ''}
        ${cols.maidens ? `<td class="num">${b.maidens ?? ''}</td>` : ''}
        ${cols.runs ? `<td class="num">${b.runs ?? ''}</td>` : ''}
        ${cols.wickets ? `<td class="num">${b.wickets ?? ''}</td>` : ''}
      </tr>`;
    }
    html += '</tbody></table>';
  }

  html += '</div></div>';
  return html;
}

function dismissalType(d) {
  if (!d) return 'unknown';
  const dl = d.toLowerCase().trim();
  if (dl === 'not out') return 'not out';
  if (dl === 'retired' || dl.startsWith('retired')) return 'retired';
  if (dl.startsWith('run out')) return 'run out';
  if (dl.startsWith('hit wicket') || dl.startsWith('ht wkt')) return 'hit wicket';
  if (/^st\s/.test(dl)) return 'stumped';
  if (dl.startsWith('lbw')) return 'lbw';
  if (/^c\s*&\s*b\s/.test(dl) || /^c\s+\S+\s+b\s+\S/.test(dl) && dl.indexOf('c') === 0) {
    if (/^c\s*&\s*b\s/.test(dl)) return 'c&b';
    return 'caught';
  }
  if (dl.startsWith('c ')) return 'caught';
  if (dl.startsWith('b ')) return 'bowled';
  return 'unknown';
}

function getDismissalTypes(battingInnings) {
  const types = new Set();
  for (const b of battingInnings) {
    types.add(dismissalType(b.dismissal));
  }
  return [...types].sort();
}

function bowlingCols(bowlers) {
  const has = { overs: false, maidens: false, runs: false, wickets: false };
  for (const b of bowlers) {
    if (b.overs != null) has.overs = true;
    if (b.maidens != null) has.maidens = true;
    if (b.runs != null) has.runs = true;
    if (b.wickets != null) has.wickets = true;
  }
  return has;
}

function ordinal(n) {
  if (n === 1) return '1st';
  if (n === 2) return '2nd';
  if (n === 3) return '3rd';
  return `${n}th`;
}

function esc(s) {
  const el = document.createElement('span');
  el.textContent = s;
  return el.innerHTML;
}

function hl(escaped, query) {
  if (!query) return escaped;
  const terms = query.split(/\s+/).filter(Boolean);
  let result = escaped;
  for (const term of terms) {
    const re = new RegExp(`(${term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    result = result.replace(re, '<mark class="highlight">$1</mark>');
  }
  return result;
}

init();
</script>
</body>
</html>
